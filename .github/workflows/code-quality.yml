name: Code Quality Assurance

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Biome
        run: pnpm lint:ci
      - name: Validate environment variables
        # INFO: `next.config.ts` imports the env module, so typegen triggers validation.
        # Unlike `pnpm typecheck`, this runs without SKIP_ENV_VALIDATION,
        # so a missing or malformed variable fails here.
        run: pnpm exec next typegen
        env:
          # WARN: CI supplies placeholder (not real) values,
          # so any present-but-wrong variable in Vercel will not be caught.
          BETTER_AUTH_SECRET: UFKwAo6mAjM7y3cnV5Bsmi08RBMfpfqIiPqi7Bo1908=
          BETTER_AUTH_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          SPOTIFY_CLIENT_ID: placeholder-spotify-client-id
          SPOTIFY_CLIENT_SECRET: placeholder-spotify-client-secret
      - name: Run typecheck
        run: pnpm typecheck
