name: Code Quality Assurance

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - name: Run Biome
        run: pnpm lint:ci
